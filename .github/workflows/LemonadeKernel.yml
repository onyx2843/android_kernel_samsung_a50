name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set timzeone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Ho_Chi_Minh"

      - name: Setting up the environment
        run: |
             sudo apt-get update
             sudo apt-get upgrade -y
             sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libssl-dev libncurses-dev flex bison bc jq

      - name: Build
        run: ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lemonade-a505f.zip
          path: "out/"
